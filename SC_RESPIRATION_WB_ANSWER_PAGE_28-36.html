   Apply class="rw-app" to body. Asset paths resolve relative to this stylesheet. */

  --rw-radius: 4px;
  --rw-radius-panel: 6px;

  --rw-content-width: 1680px;

.rw-app, .rw-app *, .rw-app *::before, .rw-app *::after { box-sizing: border-box; }
.rw-app { margin: 0; background: var(--rw-paper); color: var(--rw-ink); font: 14px/1.55 var(--rw-font); }
.rw-app [hidden] { display: none !important; }
.rw-app :focus-visible { outline: 3px solid var(--rw-focus); outline-offset: 3px; }
.rw-app a { color: var(--rw-link); text-underline-offset: 3px; }
.rw-app a:hover { color: #004d5e; }
.rw-app h1, .rw-app h2, .rw-app h3 { line-height: 1.25; }
.rw-app h1 { font-size: clamp(32px, 4vw, 40px); font-weight: 500; letter-spacing: -1.2px; margin: 12px 0 18px; }
.rw-app h2 { font-size: 24px; font-weight: 600; margin: 0 0 16px; }
.rw-app h3 { font-size: 18px; font-weight: 600; margin: 0 0 10px; }
.rw-app p { margin: 0 0 16px; }
.rw-muted, .rw-help { color: var(--rw-muted); }
.rw-help { font-size: 12px; margin-top: 6px; }
.rw-eyebrow { color: var(--rw-accent); font-size: 11px; font-weight: 700; letter-spacing: 1.7px; text-transform: uppercase; }
.rw-lead { color: var(--rw-muted); font-size: 18px; line-height: 1.7; max-width: 65ch; }
.rw-skip { position: absolute; top: -100px; left: 16px; z-index: 10; padding: 12px; background: white; }
.rw-skip:focus { top: 12px; }

/* Shared shell: charcoal header and original 6px decorative stripe. */
.rw-header { position: relative; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; padding: 18px 32px 24px; background: var(--rw-dark); color: white; }
.rw-header::after { content: ""; position: absolute; bottom: 0; left: 0; right: 0; height: 6px; background-image: var(--rw-stripe); background-position: center; background-repeat: repeat-x; background-size: auto 6px; pointer-events: none; }
.rw-brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
.rw-brand > div { min-width: 0; }
.rw-brand strong { display: block; font-size: 20px; font-weight: 600; overflow-wrap: anywhere; }
.rw-logo { width: 48px; height: 48px; object-fit: contain; flex-shrink: 0; }
.rw-header-meta { font-size: 12px; color: #d2cbc4; }
.rw-header .rw-button { background: transparent; border-color: #9b9187; color: white; }
.rw-header .rw-button:hover { background: #49423c; }
.rw-version { display: inline-block; font-size: 12px; padding: 4px 9px; border-radius: 4px; background: #484a3b; color: #e4ebd3; border: 1px solid #72775b; }
.rw-main { max-width: var(--rw-content-width); margin: auto; padding: 36px 40px; }
.rw-main--docs { --rw-content-width: 1200px; }
.rw-nav { background: white; border-bottom: 1px solid var(--rw-line); }
.rw-nav-inner { max-width: var(--rw-content-width); margin: auto; padding: 0 40px; display: flex; flex-wrap: wrap; gap: 0 24px; }
.rw-nav a { display: inline-flex; align-items: center; min-height: 48px; padding: 12px 4px 9px; border-bottom: 3px solid transparent; color: var(--rw-muted); font-weight: 600; text-decoration: none; }
.rw-nav a:hover { color: var(--rw-accent); background: var(--rw-paper); }
.rw-nav a[aria-current="page"], .rw-nav a[aria-current="location"] { color: var(--rw-accent); border-bottom-color: var(--rw-accent); }
.rw-section-nav { display: flex; flex-wrap: wrap; gap: 12px 22px; padding: 18px 0; border-block: 1px solid var(--rw-line); margin: 24px 0; }
.rw-section { padding: 32px 0; scroll-margin-top: 20px; }
.rw-section + .rw-section { border-top: 1px solid var(--rw-line); }
.rw-hero { display: grid; grid-template-columns: 1.15fr 1fr; gap: 64px; align-items: center; padding: 38px 0 52px; }
.rw-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
.rw-panel, .rw-card { min-width: 0; padding: 24px; border: 1px solid var(--rw-line); border-radius: var(--rw-radius-panel); background: white; }
.rw-panel { box-shadow: 0 2px 4px #312d2a04; }
.rw-card { border-top: 3px solid #9b876a; }
.rw-panel--accent { border-top: 4px solid #b65a40; }
.rw-metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin: 26px 0 18px; }
.rw-metric { padding: 18px 22px; background: white; border: 1px solid var(--rw-line); border-top: 3px solid #9b876a; border-radius: 4px; }
.rw-metric strong { display: block; font-size: 32px; font-weight: 500; font-variant-numeric: tabular-nums; }
.rw-metric span { font-size: 13px; color: var(--rw-muted); }
.rw-workspace { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 26px; margin-top: 24px; }
.rw-sidebar { position: sticky; top: 16px; align-self: start; max-height: 90vh; overflow: auto; padding-right: 12px; border-right: 1px solid var(--rw-line); }
.rw-sidebar h2 { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--rw-muted); margin: 20px 12px 8px; }
.rw-sidebar a, .rw-sidebar button { display: block; width: 100%; padding: 10px 12px; text-align: left; border: 0; border-left: 3px solid transparent; border-radius: 0 4px 4px 0; background: transparent; color: var(--rw-ink); font: inherit; text-decoration: none; cursor: pointer; }
.rw-sidebar [aria-current], .rw-sidebar [aria-selected="true"] { background: #e7ded3; border-left-color: var(--rw-accent); color: #613426; font-weight: 600; }
.rw-sidebar a:hover, .rw-sidebar button:hover { background: #eae5dd; }

/* Controls are opt-in, so unrelated project components are not restyled. */
.rw-actions, .rw-toolbar, .rw-pager { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.rw-toolbar { margin: 22px 0 18px; }
.rw-pager { justify-content: space-between; margin-top: 18px; }
.rw-app .rw-button { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 9px 16px; border: 1px solid var(--rw-border-strong); border-radius: 4px; background: white; color: var(--rw-ink); font: 600 14px/1.4 var(--rw-font); text-decoration: none; cursor: pointer; touch-action: manipulation; }
.rw-app .rw-button:hover { background: var(--rw-soft); }
.rw-app .rw-button--primary { background: var(--rw-accent); border-color: var(--rw-accent); color: white; }
.rw-app .rw-button--primary:hover { background: var(--rw-accent-hover); }
.rw-app .rw-button:disabled { opacity: .5; cursor: not-allowed; }
.rw-app .rw-header .rw-button { background: transparent; border-color: #9b9187; color: white; }
.rw-app .rw-header .rw-button:hover { background: #49423c; }
.rw-field { display: grid; gap: 6px; margin-bottom: 18px; min-width: 0; }
.rw-field label { font-weight: 600; }
.rw-input, .rw-select, .rw-textarea { min-height: 44px; width: 100%; min-width: 0; max-width: 100%; padding: 10px 12px; border: 1px solid var(--rw-border-strong); border-radius: 4px; background: white; color: var(--rw-ink); font: inherit; }
.rw-input::placeholder, .rw-textarea::placeholder { color: var(--rw-muted); }
.rw-textarea { resize: vertical; }
.rw-input[aria-invalid="true"], .rw-select[aria-invalid="true"], .rw-textarea[aria-invalid="true"] { border: 2px solid #b3311f; }
.rw-field-error { color: #8a281b; font-size: 13px; }
.rw-toolbar .rw-field { flex: 1 1 240px; margin: 0; }
.rw-upload { width: 100%; padding: 20px 14px; border: 1px dashed #9b9187; border-radius: 4px; background: #faf9f6; color: var(--rw-ink); font: inherit; }
.rw-upload::file-selector-button { padding: 8px 12px; margin-right: 12px; border: 1px solid var(--rw-border-strong); border-radius: 4px; background: white; font: inherit; cursor: pointer; }
.rw-notice { margin: 20px 0; padding: 14px 18px; border-left: 3px solid #8b795e; border-radius: 0 4px 4px 0; background: #eeeae2; color: #544b40; }
.rw-notice--error { background: #fff0ed; border-color: #b3311f; color: #8a281b; }
.rw-notice p:last-child { margin-bottom: 0; }
.rw-tag { display: inline-block; padding: 4px 9px; border-radius: 4px; background: #ece9e5; color: #625952; font-size: 12px; font-weight: 600; }
.rw-tag--success { background: #e5ebdc; color: #3e542b; }
.rw-tag--review { background: #fff0cf; color: #79520e; }
.rw-tag--info { background: #e1edf0; color: #285b68; }
.rw-tag--error { background: #fff0ed; color: #8a281b; }
.rw-progress { width: 100%; height: 8px; accent-color: var(--rw-accent); }
.rw-progress-indeterminate { height: 6px; overflow: hidden; border-radius: 3px; background: #e7e1d8; }
.rw-progress-indeterminate > span { display: block; width: 35%; height: 100%; background: var(--rw-accent); animation: rw-progress 1.5s ease-in-out infinite; }
@keyframes rw-progress { from { transform: translateX(-100%); } to { transform: translateX(400%); } }
.rw-table-wrap { overflow: auto; max-height: 65vh; border: 1px solid var(--rw-line); border-radius: 4px; }
.rw-table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
.rw-table caption { text-align: left; padding: 12px; font-weight: 600; background: white; }
.rw-table th { position: sticky; top: 0; z-index: 1; padding: 12px; background: #f0ede7; border-bottom: 1px solid #c6bdb2; white-space: nowrap; }
.rw-table td { padding: 12px; min-width: 140px; border-bottom: 1px solid #e9e4de; vertical-align: top; overflow-wrap: anywhere; }
.rw-table tbody tr:nth-child(even) { background: #fcfbf9; }
.rw-table tbody tr:hover { background: #f2eee7; }
.rw-table th button { min-height: 36px; border: 0; background: transparent; color: inherit; font: inherit; font-weight: 600; cursor: pointer; }
.rw-empty { padding: 40px 20px; text-align: center; color: var(--rw-muted); }
.rw-unknown { color: #736b65; font-style: italic; }
.rw-dialog { width: min(680px, calc(100vw - 32px)); max-height: 80vh; overflow: auto; padding: 0; border: 1px solid var(--rw-line); border-radius: 6px; color: var(--rw-ink); background: white; box-shadow: 0 12px 48px #0004; }
.rw-dialog::backdrop { background: #18151280; }
.rw-dialog-heading { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; padding: 20px 24px; border-bottom: 1px solid var(--rw-line); }
.rw-dialog-heading h2 { margin: 0; }
.rw-dialog-body { padding: 24px; }
.rw-details { margin: 24px 0; border-top: 1px solid var(--rw-line); padding-top: 18px; }
.rw-details summary { cursor: pointer; font-weight: 600; }
.rw-code { font: 13px/1.7 var(--rw-mono); padding: 18px; background: var(--rw-soft); border-radius: 4px; white-space: pre-wrap; overflow-wrap: anywhere; }
.rw-footer { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; margin-top: 30px; padding: 22px 24px; background: var(--rw-soft); border-top: 1px solid var(--rw-line); border-radius: 0 0 4px 4px; font-size: 12px; }
@media (max-width: 1000px) {
  .rw-main { padding: 28px; }
  .rw-hero { gap: 30px; }
  .rw-workspace { grid-template-columns: 200px minmax(0, 1fr); }
}
@media (max-width: 760px) {
  .rw-header { padding: 18px 20px 24px; align-items: flex-start; }
  .rw-main { padding: 22px 18px; }
  .rw-nav-inner { padding: 0 18px; gap: 0 18px; }
  .rw-hero, .rw-workspace { grid-template-columns: 1fr; gap: 24px; }
  .rw-hero { padding: 12px 0 28px; }
  .rw-metrics, .rw-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .rw-sidebar { position: static; max-height: 230px; padding: 12px; border: 1px solid var(--rw-line); border-radius: 4px; background: #eeebe5; }
  .rw-panel, .rw-card { padding: 18px; }
  .rw-table-wrap { max-height: 60vh; }
  .rw-footer { align-items: flex-start; flex-direction: column; }
}
@media (max-width: 480px) { .rw-grid { grid-template-columns: 1fr; } .rw-metric { padding: 14px; } }
@media (prefers-reduced-motion: reduce) { .rw-app *, .rw-app *::before, .rw-app *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } .rw-progress-indeterminate > span { width: 100%; opacity: .65; } }
@media print {
  .rw-app { background: white; color: black; }
  .rw-header { background: white; color: black; border-bottom: 1px solid #777; }
  .rw-header-meta { color: #555; }
  .rw-header::after, .rw-nav, .rw-sidebar, .rw-toolbar, .rw-pager, .rw-actions, .rw-skip { display: none !important; }
  .rw-main { padding: 0; }
  .rw-workspace { display: block; }
  .rw-panel { padding: 0; border: 0; box-shadow: none; }
  .rw-table-wrap { max-height: none; overflow: visible; }
  .rw-table th { position: static; }
  .rw-footer { background: white; }
}

/* Quiz presentation adapter. Quiz data, IDs, and runtime behavior are unchanged. */
:root { color-scheme: light; }
.app { max-width: 1200px; margin: auto; padding: 36px 40px; }
.card { min-width: 0; padding: 24px; background: var(--rw-surface); border: 1px solid var(--rw-line); border-radius: 6px; box-shadow: 0 2px 4px #312d2a04; }
.rw-header h1 { margin: 0; color: white; overflow-wrap: anywhere; }
.modeTitle { margin: 0 0 12px; font-weight: 600; }
.modeChooser { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 10px; margin-bottom: 12px; }
.rw-app button { min-height: 44px; padding: 9px 16px; border: 1px solid var(--rw-border-strong); border-radius: 4px; background: white; color: var(--rw-ink); font: 600 14px/1.4 var(--rw-font); cursor: pointer; touch-action: manipulation; overflow-wrap: anywhere; }
.rw-app button:hover { background: var(--rw-soft); }
.rw-app button.primary, .rw-app .modeBtn.active { background: var(--rw-accent); border-color: var(--rw-accent); color: white; }
.rw-app button.primary:hover, .rw-app .modeBtn.active:hover { background: var(--rw-accent-hover); }
.rw-app button.danger { background: #fff0ed; color: #8a281b; border-color: #b3311f; }
.rw-app button:disabled { opacity: .5; cursor: not-allowed; }
.toolbar, .actions, .nav { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 18px; }
.toolbar { margin: 18px 0; }
.meta, .status { display: flex; gap: 12px; flex-wrap: wrap; color: var(--rw-muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.badge { display: inline-block; padding: 4px 9px; border-radius: 4px; background: #ece9e5; color: #625952; font-size: 12px; font-weight: 600; }
.bar { height: 8px; background: var(--rw-soft); border-radius: 4px; overflow: hidden; margin: 18px 0; }
.bar>div { height: 100%; background: var(--rw-accent); width: 0; transition: width .25s ease; }
.prompt { font-size: 18px; line-height: 1.55; margin: 20px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.sourcePrompt { font-size: 13px; color: var(--rw-muted); background: var(--rw-soft); border: 1px solid var(--rw-line); padding: 12px; border-radius: 4px; margin-bottom: 12px; white-space: pre-wrap; }
.visual { display: block; max-width: 100%; border-radius: 4px; border: 1px solid var(--rw-line); margin: 12px auto 18px; }
.choices, .optionalChoices { display: grid; gap: 12px; }
.rw-app .choice, .rw-app .optionalChoice { text-align: left; font-weight: 400; padding: 12px 16px; }
.rw-app .choice.selected { border-color: var(--rw-accent); background: #e7ded3; box-shadow: inset 3px 0 var(--rw-accent); }
.rw-app .choice.correct { border-color: #3e542b; background: #e5ebdc; }
.rw-app .choice.wrong { border-color: #b3311f; background: #fff0ed; }
.answerBox { display: none; margin-top: 14px; padding: 14px 18px; border-left: 3px solid #8b795e; border-radius: 0 4px 4px 0; background: #eeeae2; color: #544b40; white-space: pre-wrap; overflow-wrap: anywhere; }
.textInput, .textarea { font: inherit; width: 100%; min-width: 0; min-height: 44px; padding: 10px 12px; border-radius: 4px; border: 1px solid var(--rw-border-strong); background: white; color: var(--rw-ink); }
.textarea { min-height: 150px; resize: vertical; }
.matchingGrid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 10px; }
.matchingGrid>div { padding: 12px; border: 1px solid var(--rw-line); border-radius: 4px; overflow-wrap: anywhere; }
.spacer { flex: 1; }
.footer { margin-top: 24px; padding: 18px; background: var(--rw-soft); border-top: 1px solid var(--rw-line); color: var(--rw-muted); font-size: 12px; }
.hidden { display: none !important; }
@media(max-width:1000px) { .app { padding: 28px; } }
@media(max-width:760px) { .app { padding: 22px 18px; } .card { padding: 18px; } .modeChooser { grid-template-columns: repeat(2,minmax(0,1fr)); } .matchingGrid { grid-template-columns: 1fr; } .nav button { flex: 1; } .spacer { display: none; } }
@media(max-width:480px) { .toolbar button { flex: 1 1 auto; } }
@media print { .app { padding: 0; } .card { border: 0; box-shadow: none; } .toolbar,.actions,.nav,.modeChooser,.modeTitle { display: none !important; } .rw-header h1 { color: black; } }

/* Presentation adapters for alternate quiz markup. */
:root { --muted: var(--rw-muted); }
.modes { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin:12px 0; }
.rw-app .mode.active { background:var(--rw-accent); border-color:var(--rw-accent); color:white; }
.rw-app .mode.active:hover { background:var(--rw-accent-hover); }
.rw-app .choice.sel { border-color:var(--rw-accent); background:#e7ded3; box-shadow:inset 3px 0 var(--rw-accent); }
.rw-app .choice.good { border-color:#3e542b; background:#e5ebdc; }
.rw-app .choice.bad { border-color:#b3311f; background:#fff0ed; }
.source { font-size:13px; color:var(--rw-muted); background:var(--rw-soft); border:1px solid var(--rw-line); padding:12px; border-radius:4px; margin-bottom:12px; white-space:pre-wrap; overflow-wrap:anywhere; }
.answer { display:none; margin-top:14px; padding:14px 18px; border-left:3px solid #8b795e; border-radius:0 4px 4px 0; background:#eeeae2; color:#544b40; white-space:pre-wrap; overflow-wrap:anywhere; }
.rw-app input, .rw-app textarea { font:inherit; width:100%; min-width:0; min-height:44px; padding:10px 12px; border-radius:4px; border:1px solid var(--rw-border-strong); background:white; color:var(--rw-ink); }
.rw-app textarea { min-height:150px; resize:vertical; }
.sub { color:var(--rw-muted); margin-bottom:16px; }
@media(max-width:760px) { .modes { grid-template-columns:repeat(2,minmax(0,1fr)); } }
@media print { .modes { display:none !important; } }

const $=s=>document.querySelector(s);function save(){localStorage.setItem(key,JSON.stringify(state))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function norm(s){return String(s??'').trim().toLocaleLowerCase()}
